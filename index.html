    <style>
      #shaani-loader {
        position: fixed;
        inset: 0;
        z-index: 120;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f3ed;
        transition: opacity 0.7s ease;
      }
      #shaani-loader.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      #shaani-loader img {
        width: 9.5rem;
        height: 9.5rem;
        border-radius: 9999px;
        object-fit: cover;
        opacity: 0;
        animation: shaani-logo-in 0.9s ease 0.12s forwards;
        box-shadow: 0 12px 40px rgba(75, 15, 27, 0.18);
      }
      @keyframes shaani-logo-in {
        from {
          opacity: 0;
          transform: scale(0.88);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #shaani-loader img {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
